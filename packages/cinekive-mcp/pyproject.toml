[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinekive-mcp"
version = "0.1.0"
description = "MCP server for Cinekive Pro — local cinematic archive tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
cinekive-mcp = "cinekive_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cinekive_mcp*"]
